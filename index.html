<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Original Text Screenshot Editor</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#111;
    color:#fff;
}

header{
    padding:18px;
    text-align:center;
    background:#181818;
    border-bottom:1px solid #333;
}

header h2{
    margin:0 0 6px;
}

header p{
    margin:0;
    color:#aaa;
    font-size:14px;
}

.toolbar{
    padding:15px;
    background:#1c1c1c;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    justify-content:center;
}

button,
label{
    background:#2563eb;
    color:white;
    border:0;
    border-radius:8px;
    padding:11px 16px;
    cursor:pointer;
    font-size:14px;
}

button:hover,
label:hover{
    background:#1d4ed8;
}

input[type=file]{
    display:none;
}

.workspace{
    padding:20px;
    overflow:auto;
    text-align:center;
}

#canvas{
    display:inline-block;
    max-width:100%;
    height:auto;
    background:#fff;
    box-shadow:0 0 25px rgba(0,0,0,.5);
}

.status{
    padding:12px;
    text-align:center;
    color:#aaa;
}

.editor{
    display:none;
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%);
    width:min(600px,94%);
    background:#202020;
    padding:15px;
    border-radius:14px;
    box-shadow:0 10px 40px #000;
    z-index:20;
}

.editor input{
    width:100%;
    padding:13px;
    border:1px solid #444;
    border-radius:8px;
    background:#111;
    color:#fff;
    font-size:18px;
    outline:none;
}

.editor-buttons{
    display:flex;
    gap:10px;
    margin-top:10px;
}

.editor-buttons button{
    flex:1;
}

#cancel{
    background:#444;
}

#saveText{
    background:#16a34a;
}

.instructions{
    max-width:800px;
    margin:10px auto;
    color:#aaa;
    font-size:13px;
    line-height:1.7;
}
</style>
</head>

<body>

<header>
    <h2>Original Text Screenshot Editor</h2>
    <p>صرف text تبدیل کریں — تصویر کا باقی حصہ برقرار رہے</p>
</header>

<div class="toolbar">

    <label for="imageInput">
        📷 Screenshot منتخب کریں
    </label>

    <input
        id="imageInput"
        type="file"
        accept="image/png,image/jpeg,image/webp"
    >

    <button id="detectBtn">
        🔍 Text Detect کریں
    </button>

    <button id="downloadBtn">
        ⬇️ Download
    </button>

</div>

<div class="status" id="status">
    پہلے screenshot منتخب کریں۔
</div>

<div class="workspace">
    <canvas id="canvas"></canvas>
</div>

<div class="instructions">
    Text detect ہونے کے بعد تصویر میں کسی detected text پر click کریں۔
    پھر صرف نیا text لکھیں اور Save کریں۔
</div>

<div class="editor" id="editor">

    <input
        id="textInput"
        type="text"
        autocomplete="off"
        spellcheck="false"
    >

    <div class="editor-buttons">
        <button id="cancel">
            Cancel
        </button>

        <button id="saveText">
            Save Text
        </button>
    </div>

</div>


<!-- OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<!-- OpenCV: صرف text کے پرانے pixels صاف کرنے کے لیے -->
<script async src="https://docs.opencv.org/4.x/opencv.js"></script>


<script>

const imageInput = document.getElementById("imageInput");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d", {
    willReadFrequently:true
});

const statusBox = document.getElementById("status");
const detectBtn = document.getElementById("detectBtn");
const downloadBtn = document.getElementById("downloadBtn");

const editor = document.getElementById("editor");
const textInput = document.getElementById("textInput");
const saveText = document.getElementById("saveText");
const cancel = document.getElementById("cancel");

let originalImage = null;
let detectedWords = [];
let selectedWord = null;


/*
    IMPORTANT

    تصویر ہمیشہ اس کی ORIGINAL / NATIVE resolution
    میں canvas پر load ہوگی۔

    CSS صرف screen پر اسے چھوٹا دکھا سکتا ہے۔
    اصل canvas resolution تبدیل نہیں ہوگی۔
*/

imageInput.addEventListener("change", function(e){

    const file = e.target.files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(event){

        const img = new Image();

        img.onload = function(){

            originalImage = img;

            /*
                یہاں کوئی resize نہیں۔
                اصل width اور height ہی استعمال ہوں گے۔
            */

            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.drawImage(
                img,
                0,
                0,
                img.naturalWidth,
                img.naturalHeight
            );

            detectedWords = [];

            statusBox.textContent =
                "Screenshot تیار ہے۔ اب Text Detect کریں۔";
        };

        img.src = event.target.result;
    };

    reader.readAsDataURL(file);
});


/*
    OCR
*/

detectBtn.addEventListener("click", async function(){

    if(!originalImage){

        alert("پہلے screenshot منتخب کریں۔");
        return;
    }

    statusBox.textContent =
        "Text detect ہو رہا ہے، تھوڑا انتظار کریں...";

    detectBtn.disabled = true;

    try{

        const result = await Tesseract.recognize(
            canvas,
            "eng",
            {
                logger: function(info){

                    if(info.status){

                        let percent =
                            Math.round(
                                (info.progress || 0) * 100
                            );

                        statusBox.textContent =
                            info.status +
                            " " +
                            percent +
                            "%";
                    }
                }
            }
        );

        detectedWords = [];

        /*
            صرف meaningful words رکھیں
        */

        if(result.data.words){

            result.data.words.forEach(function(word){

                const text =
                    (word.text || "").trim();

                if(!text) return;

                if(!word.bbox) return;

                detectedWords.push({

                    text:text,

                    x:word.bbox.x0,
                    y:word.bbox.y0,

                    width:
                        word.bbox.x1 -
                        word.bbox.x0,

                    height:
                        word.bbox.y1 -
                        word.bbox.y0
                });
            });
        }

        statusBox.textContent =
            detectedWords.length +
            " text areas detect ہو گئے۔ کسی text پر click کریں۔";

        drawDetectionBoxes();

    }catch(error){

        console.error(error);

        statusBox.textContent =
            "Text detection میں مسئلہ آیا۔";
    }

    detectBtn.disabled = false;
});


/*
    Detection boxes دکھانا
*/

function drawDetectionBoxes(){

    if(!originalImage) return;

    /*
        پہلے ORIGINAL image دوبارہ draw کریں۔
        اس سے صرف temporary boxes ختم ہوتے ہیں۔
    */

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    ctx.drawImage(
        originalImage,
        0,
        0,
        originalImage.naturalWidth,
        originalImage.naturalHeight
    );

    /*
        Detection boxes
    */

    ctx.save();

    ctx.lineWidth = 2;

    detectedWords.forEach(function(word){

        ctx.strokeStyle =
            "rgba(0,120,255,.8)";

        ctx.strokeRect(
            word.x,
            word.y,
            word.width,
            word.height
        );

    });

    ctx.restore();
}


/*
    Canvas click
*/

canvas.addEventListener("click", function(e){

    if(!detectedWords.length) return;

    const rect =
        canvas.getBoundingClientRect();

    /*
        Canvas کی اصل resolution اور screen
        resolution مختلف ہو سکتی ہے۔

        اس لیے click coordinates کو native
        canvas coordinates میں convert کریں۔
    */

    const scaleX =
        canvas.width / rect.width;

    const scaleY =
        canvas.height / rect.height;

    const x =
        (e.clientX - rect.left) * scaleX;

    const y =
        (e.clientY - rect.top) * scaleY;


    let found = null;

    for(let i = 0; i < detectedWords.length; i++){

        const word = detectedWords[i];

        if(
            x >= word.x &&
            x <= word.x + word.width &&
            y >= word.y &&
            y <= word.y + word.height
        ){

            found = word;
            break;
        }
    }

    if(!found) return;

    selectedWord = found;

    textInput.value =
        found.text;

    editor.style.display =
        "block";

    textInput.focus();

    textInput.select();
});


/*
    Cancel
*/

cancel.addEventListener("click", function(){

    editor.style.display =
        "none";

    selectedWord = null;

    drawDetectionBoxes();
});


/*
    Save replacement
*/

saveText.addEventListener("click", async function(){

    if(!selectedWord) return;

    const newText =
        textInput.value;

    if(!newText.trim()){

        alert("Text خالی نہیں ہو سکتا۔");
        return;
    }

    editor.style.display =
        "none";

    statusBox.textContent =
        "Text replace ہو رہا ہے...";

    /*
        Old text region کی copy محفوظ کریں
    */

    const box = {

        x:selectedWord.x,
        y:selectedWord.y,

        width:selectedWord.width,
        height:selectedWord.height
    };


    /*
        پہلے old text کو background سے remove
        کرنے کی کوشش۔

        OpenCV available ہو تو inpainting استعمال ہوگی۔
    */

    await removeOldText(box);


    /*
        New text کو اسی area میں fit کریں۔

        اصل image resize نہیں ہوتی۔
        صرف اسی text region پر replacement ہوتا ہے۔
    */

    drawReplacementText(
        newText,
        box
    );


    selectedWord.text =
        newText;

    statusBox.textContent =
        "Text replace ہو گیا۔";

    selectedWord = null;
});


/*
    Old text remove
*/

async function removeOldText(box){

    /*
        اگر OpenCV ابھی load نہیں ہوئی
        تو local background estimation استعمال کریں۔
    */

    if(
        typeof cv === "undefined" ||
        !cv.Mat
    ){

        simpleBackgroundFill(box);
        return;
    }

    try{

        const src =
            cv.imread(canvas);

        const mask =
            new cv.Mat.zeros(
                canvas.height,
                canvas.width,
                cv.CV_8UC1
            );

        /*
            text کے اردگرد تھوڑا margin
        */

        const margin = Math.max(
            2,
            Math.round(box.height * 0.12)
        );

        const x =
            Math.max(
                0,
                Math.floor(box.x - margin)
            );

        const y =
            Math.max(
                0,
                Math.floor(box.y - margin)
            );

        const w =
            Math.min(
                canvas.width - x,
                Math.ceil(box.width + margin * 2)
            );

        const h =
            Math.min(
                canvas.height - y,
                Math.ceil(box.height + margin * 2)
            );

        cv.rectangle(
            mask,
            new cv.Point(x,y),
            new cv.Point(x+w,y+h),
            new cv.Scalar(255),
            -1
        );

        const dst =
            new cv.Mat();

        /*
            Telea inpainting
        */

        cv.inpaint(
            src,
            mask,
            dst,
            Math.max(2, box.height * 0.25),
            cv.INPAINT_TELEA
        );

        cv.imshow(
            canvas,
            dst
        );

        src.delete();
        mask.delete();
        dst.delete();

    }catch(error){

        console.warn(
            "OpenCV inpaint failed:",
            error
        );

        simpleBackgroundFill(box);
    }
}


/*
    Flat/simple background کے لیے fallback
*/

function simpleBackgroundFill(box){

    const pad = 2;

    const x =
        Math.max(
            0,
            Math.floor(box.x - pad)
        );

    const y =
        Math.max(
            0,
            Math.floor(box.y - pad)
        );

    const w =
        Math.min(
            canvas.width - x,
            Math.ceil(box.width + pad * 2)
        );

    const h =
        Math.min(
            canvas.height - y,
            Math.ceil(box.height + pad * 2)
        );


    /*
        چاروں sides سے pixels sample کریں
    */

    const samples = [];

    function addSample(px,py){

        if(
            px < 0 ||
            py < 0 ||
            px >= canvas.width ||
            py >= canvas.height
        ) return;

        const data =
            ctx.getImageData(
                px,
                py,
                1,
                1
            ).data;

        samples.push([
            data[0],
            data[1],
            data[2],
            data[3]
        ]);
    }


    for(let i=0;i<10;i++){

        addSample(
            x - 2,
            y + Math.floor(
                h * i / 10
            )
        );

        addSample(
            x + w + 2,
            y + Math.floor(
                h * i / 10
            )
        );

        addSample(
            x + Math.floor(
                w * i / 10
            ),
            y - 2
        );

        addSample(
            x + Math.floor(
                w * i / 10
            ),
            y + h + 2
        );
    }


    if(!samples.length) return;


    let r=0,g=0,b=0,a=0;

    samples.forEach(function(c){

        r += c[0];
        g += c[1];
        b += c[2];
        a += c[3];
    });

    r = Math.round(r/samples.length);
    g = Math.round(g/samples.length);
    b = Math.round(b/samples.length);
    a = Math.round(a/samples.length);


    ctx.fillStyle =
        `rgba(${r},${g},${b},${a/255})`;

    ctx.fillRect(
        x,
        y,
        w,
        h
    );
}


/*
    Replacement text

    یہاں image کا size یا position تبدیل نہیں ہوتا۔

    Text کو original bounding box کے اندر fit کیا جاتا ہے۔
*/

function drawReplacementText(text,box){

    ctx.save();

    /*
        پہلے original text box کی estimated
        typography سے قریب ترین font size
        نکالیں۔
    */

    let fontSize =
        Math.max(
            8,
            Math.floor(
                box.height * 0.82
            )
        );


    /*
        Default font fallback ہے۔
        Browser screenshot سے اصل font-file
        recover نہیں کر سکتا۔
    */

    ctx.textBaseline =
        "middle";

    ctx.textAlign =
        "left";

    /*
        اگر replacement چھوٹا/بڑا ہو تو font-size
        کو box کے اندر fit کریں۔
    */

    while(fontSize > 4){

        ctx.font =
            `${fontSize}px Arial`;

        const metrics =
            ctx.measureText(text);

        if(
            metrics.width <=
            box.width * 1.02
        ){
            break;
        }

        fontSize--;
    }


    /*
        Center vertically
    */

    const metrics =
        ctx.measureText(text);

    const textWidth =
        metrics.width;

    const drawX =
        box.x +
        Math.max(
            0,
            (box.width - textWidth) / 2
        );

    const drawY =
        box.y +
        box.height / 2;


    /*
        Color surrounding pixels سے estimate
    */

    const color =
        estimateTextColor(box);


    ctx.fillStyle =
        color;


    ctx.fillText(
        text,
        drawX,
        drawY
    );

    ctx.restore();
}


/*
    Text color estimate
*/

function estimateTextColor(box){

    const x =
        Math.max(
            0,
            Math.floor(box.x)
        );

    const y =
        Math.max(
            0,
            Math.floor(box.y)
        );

    const w =
        Math.min(
            canvas.width-x,
            Math.max(1,Math.floor(box.width))
        );

    const h =
        Math.min(
            canvas.height-y,
            Math.max(1,Math.floor(box.height))
        );


    const data =
        ctx.getImageData(
            x,
            y,
            w,
            h
        ).data;


    let dark = 0;
    let total = 0;


    for(let i=0;i<data.length;i+=4){

        const r=data[i];
        const g=data[i+1];
        const b=data[i+2];

        const brightness =
            (r+g+b)/3;

        if(brightness < 120){

            dark += brightness;
            total++;
        }
    }


    if(total === 0){

        return "#000";
    }


    const avg =
        dark/total;

    const v =
        Math.max(
            0,
            Math.min(
                255,
                Math.round(avg)
            )
        );

    return `rgb(${v},${v},${v})`;
}


/*
    Download

    ہمیشہ canvas کی ORIGINAL resolution میں۔
*/

downloadBtn.addEventListener("click", function(){

    if(!originalImage){

        alert("پہلے screenshot منتخب کریں۔");
        return;
    }

    const link =
        document.createElement("a");

    link.download =
        "edited-screenshot.png";

    link.href =
        canvas.toDataURL(
            "image/png"
        );

    link.click();
});


/*
    Escape = close editor
*/

document.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Escape"){

            editor.style.display =
                "none";

            selectedWord = null;

            if(originalImage){
                drawDetectionBoxes();
            }
        }
    }
);

</script>

</body>
</html>
